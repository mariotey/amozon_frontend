<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#131921">
    <meta name="description" content="Explore popular products and live personalized recommendations in the Amozon demo storefront.">
    <title>Amozon</title>
    <link rel="stylesheet" href="/static/store.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317212b'/%3E%3Ctext x='8' y='24' fill='%23ffad45' font-size='28' font-family='Arial'%3Ea%3C/text%3E%3C/svg%3E">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-main">
        <a class="brand" id="home-link" href="/" aria-label="Amozon home">
          <span class="brand-name">amozon</span><span class="brand-smile" aria-hidden="true"></span>
        </a>
        <div class="account-area" id="shoppers" aria-live="polite" aria-busy="true">
          <span>Loading<span class="loading-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></span>
        </div>
      </div>
    </header>
    <main class="page-shell" id="main-content" tabindex="-1">
      <div id="storefront"></div>
      <noscript><p>Please enable JavaScript to load shoppers, products, and reviews.</p></noscript>
    </main>
    <footer class="site-footer">
      <p>Amozon is a parody demo storefront. It is not affiliated with Amazon, and purchases are entirely imaginary.</p>
    </footer>
    <script id="app-config" type="application/json">{{ client_config | tojson }}</script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
